name: acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install official MoonBit toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - name: JS integration and independent references
        if: matrix.target == 'js'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run examples
          node tools/differential.cjs
          node tools/trle-corpus.cjs
          node tools/upstream-differential.cjs
          node tools/benchmark.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.target == 'js'
        with:
          name: measurements-js
          path: output/
          if-no-files-found: error
